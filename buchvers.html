<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUCHVERS - Copiloto Comercial</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-4">

    <!-- EL BLOC DE NOTAS INTELIGENTE (Copiloto) -->
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-emerald-500">
        
        <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">BUCHVERS 🛡️</h1>
        <p class="text-slate-500 text-sm text-center mb-6">Copiloto Estratégico y Compliance</p>

        <!-- 1. La Solicitud -->
        <div class="mb-4">
            <label class="block text-slate-700 text-sm font-bold mb-2">1. Solicitud del Cliente (El Problema):</label>
            <textarea id="solicitudCliente" rows="2" placeholder="Ej. El cliente llama porque se le cae el internet..." 
                   class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"></textarea>
        </div>

        <!-- 2. La Solución -->
        <div class="mb-4">
            <label class="block text-slate-700 text-sm font-bold mb-2">2. Solución Aplicada:</label>
            <textarea id="solucionAplicada" rows="2" placeholder="Ej. Reinicio de router y actualización de firmware..." 
                   class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"></textarea>
        </div>

        <!-- 3. Producto a Configurar (Para el Ofrecimiento) -->
        <div class="mb-6">
            <label class="block text-slate-700 text-sm font-bold mb-2">3. Producto a Ofrecer / Configurar:</label>
            <select id="productoOfrecido" 
                    class="w-full border border-slate-300 rounded p-2 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 bg-white">
                <option value="Fibra Optica">Upgrade a Fibra Óptica (Requiere guion de cobertura)</option>
                <option value="Plan Movil">Línea Móvil Adicional (Requiere protección de datos)</option>
                <option value="Television">Paquete TV Premium (Requiere permanencia)</option>
            </select>
        </div>

        <!-- El Nuevo Botón Perezoso -->
        <button onclick="generarGuiaSegura()" 
                class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded hover:bg-emerald-700 transition duration-300 shadow-md flex justify-center items-center gap-2">
            <span>Generar Guía de Cierre Seguro 🦥</span>
        </button>
        <!-- Área de Resultados (Oculta por defecto) -->
        <div id="resultadoGuia" class="mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded hidden">
            <h3 class="font-bold text-emerald-800 text-sm mb-2">📋 Guía de Cierre Sugerida:</h3>
            <p id="textoGuia" class="text-sm text-emerald-700 whitespace-pre-wrap"></p>
            <!-- Botón para copiar al CRM -->
        <button onclick="copiarResumenCRM()" 
                class="mt-4 w-full bg-slate-800 text-white font-bold py-2 px-4 rounded hover:bg-slate-900 transition duration-300 text-sm flex justify-center items-center gap-2">
            📋 Copiar Resumen para Cosmos
        </button>
        </div>

    </div>
    <!-- El "Cerebro" de la aplicación -->
    <script>
        function generarGuiaSegura() {
            // 1. Atrapamos lo que el asesor escribió
            const solicitud = document.getElementById('solicitudCliente').value;
            const solucion = document.getElementById('solucionAplicada').value;
            const producto = document.getElementById('productoOfrecido').value;

            // 2. Validación de seguridad: no dejar campos vacíos
            if(!solicitud || !solucion) {
                alert("⚠️ Arquitecto, por favor llena la Solicitud y la Solución antes de continuar.");
                return;
            }

            // 3. Nuestro Motor de Reglas (Simulando la IA por ahora)
            let guiaLegal = "";
            
            if(producto === "Fibra Optica") {
                guiaLegal = "⚠️ ALERTA DE COMPLIANCE (FIBRA):\n\n1. Validar viabilidad técnica de la zona en Cosmos.\n2. Leer obligatoriamente el guion de cobertura.\n3. Informar los tiempos de instalación antes de cerrar.";
            } else if(producto === "Plan Movil") {
                guiaLegal = "⚠️ ALERTA DE COMPLIANCE (MÓVIL):\n\n1. ¡NO OLVIDAR! Leer guion de Protección de Datos Personales (Habeas Data).\n2. Validar identidad del titular.\n3. Enviar SMS para firma digital.";
            } else {
                guiaLegal = "⚠️ ALERTA DE COMPLIANCE (TV):\n\n1. Confirmar titularidad.\n2. Informar sobre la cláusula de permanencia obligatoria.";
            }

            // 4. Inyectar el resultado en la pantalla y quitar el estado "oculto"
            document.getElementById('textoGuia').innerText = guiaLegal;
            document.getElementById('resultadoGuia').classList.remove('hidden');
        }
        function copiarResumenCRM() {
        const solicitud = document.getElementById('solicitudCliente').value;
        const solucion = document.getElementById('solucionAplicada').value;
        const producto = document.getElementById('productoOfrecido').options[document.getElementById('productoOfrecido').selectedIndex].text;
        
        // Construimos la plantilla exacta que le gusta a los líderes
        const plantillaCRM = `=== REPORTE MBUCHVERS ===\n🗣️ SOLICITUD: ${solicitud}\n✅ SOLUCIÓN: ${solucion}\n📦 PRODUCTO GESTIONADO: ${producto}\n=========================`;
        
        // Usamos la API del navegador para copiar al portapapeles
        navigator.clipboard.writeText(plantillaCRM).then(() => {
            alert("¡Resumen copiado al portapapeles! 🚀 Listo para pegar en Cosmos.");
        }).catch(err => {
            alert("Error al copiar: " + err);
        });
    }
    </script>

</body>
</html>
