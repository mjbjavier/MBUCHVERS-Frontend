<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBUCHVERS - Dashboard Operativo</title>
    <!-- Importamos Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col items-center justify-center">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-3xl p-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-cyan-400 mb-2">MBUCHVERS</h1>
        <p class="text-slate-400 mb-6">Panel de Asignación en Tiempo Real</p>

        <!-- Controles del Simulador -->
        <div class="mb-6 p-4 bg-slate-700/50 rounded-lg border border-slate-600 flex gap-2">
            <input id="input-nombre" type="text" placeholder="Nombre del cliente..." class="w-full p-2 rounded-lg bg-slate-900 text-white border border-slate-600 focus:border-cyan-400 outline-none">
            
            <select id="input-motivo" class="w-full p-2 rounded-lg bg-slate-900 text-white border border-slate-600 focus:border-cyan-400 outline-none">
                <option value="Ventas">Ventas</option>
                <option value="Soporte Técnico">Soporte Técnico</option>
                <option value="Retenciones">Retenciones</option>
            </select>
            
            <button onclick="simularLlamada()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg transition-transform active:scale-95 whitespace-nowrap">
                Entra Llamada
            </button>
        </div>
        
        <!-- Aquí JavaScript inyectará las tarjetas de los clientes -->
        <div id="contenedor-clientes" class="space-y-4">
            <p class="text-slate-500 animate-pulse">Cargando datos del servidor...</p>
        </div>
    </div>
<!-- Conectamos la lógica -->
    <script src="app.js"></script>
</body>
</html>
